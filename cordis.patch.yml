# ============================================================================
# dsh-douyin-bridge —— DSH bundle patch（插件**自带**的挂载声明）
# ============================================================================
# 这就是「标准 DSH 插件」的样子：包自己声明要往 profile 的配置树里插什么。
# 装上之后，profile 只要在 `dsh.profile.bundles` 里列出本包名即生效，
# 不用再手改 profile 自己的 cordis.patch.yml：
#
#   dsh plugin --profile desktop add link:<你自己的插件目录>
#
# 真正的用户配置在插件自己的家目录（$DSH_HOME/douyin-bridge/config.json），
# 这里只放默认值。
# ============================================================================

- insert:
    - id: douyin-bridge
      name: dsh-douyin-bridge
      config:
        enabled: true
        mode: simulation
        pollIntervalMs: 20000
        peers: []
        sharePeers: []
        autoReply: true
        maxInjectChars: 4000
